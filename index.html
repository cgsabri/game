<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Games Hub</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">🎮 Interactive Math Games Hub</h1>
        <p class="text-indigo-200 text-sm">Collection of math games organized by Year Level & Topic</p>
      </div>
      <button onclick="toggleAdminModal(true)" class="bg-indigo-800 hover:bg-indigo-900 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
        ⚙️ Admin Panel (Add Game)
      </button>
    </div>
  </header>

  <!-- Content Wrapper -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">

    <!-- Filters Section -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
      <div class="flex flex-col md:flex-row gap-4 w-full md:w-auto flex-1">
        
        <!-- Filter Year -->
        <div class="w-full md:w-48">
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Year Level</label>
          <select id="filterTahun" onchange="renderGames()" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="All">All Years</option>
            <option value="Year 1">Year 1</option>
            <option value="Year 2">Year 2</option>
            <option value="Year 3">Year 3</option>
            <option value="Year 4">Year 4</option>
            <option value="Year 5">Year 5</option>
            <option value="Year 6">Year 6</option>
          </select>
        </div>

        <!-- Filter Topic -->
        <div class="w-full md:w-48">
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Topic</label>
          <select id="filterTopic" onchange="renderGames()" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="All">All Topics</option>
            <!-- Dynamic topics populated via JS -->
          </select>
        </div>

      </div>

      <!-- Game Counter -->
      <div class="text-sm text-slate-500 self-end md:self-center font-medium">
        Total Games: <span id="gameCount" class="text-indigo-600 font-bold">0</span>
      </div>
    </div>

    <!-- Game Grid Container -->
    <div id="gameGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Dynamic Game Cards will load here -->
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-500">
    <p>© Math Games Hub. Hosted on GitHub Pages.</p>
  </footer>

  <!-- ==================== MODAL: PLAY GAME ==================== -->
  <div id="playModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-4xl w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
      <div class="p-4 bg-slate-100 border-b border-slate-200 flex justify-between items-center">
        <h3 id="playModalTitle" class="font-bold text-slate-800 text-lg">Game Title</h3>
        <button onclick="closePlayModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl px-2">✕</button>
      </div>
      <div id="playModalContainer" class="p-4 flex-1 overflow-auto flex items-center justify-center min-h-[400px]">
        <!-- Embedded iframe loads here -->
      </div>
    </div>
  </div>

  <!-- ==================== MODAL: ADMIN (ADD GAME) ==================== -->
  <div id="adminModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h3 class="font-bold text-slate-800 text-lg">⚙️ Add New Game</h3>
        <button onclick="toggleAdminModal(false)" class="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
      </div>

      <form id="addGameForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Game Title</label>
          <input type="text" id="inputTitle" required placeholder="e.g. Basic Fractions Challenge" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Year Level</label>
            <select id="inputTahun" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="Year 1">Year 1</option>
              <option value="Year 2">Year 2</option>
              <option value="Year 3">Year 3</option>
              <option value="Year 4">Year 4</option>
              <option value="Year 5">Year 5</option>
              <option value="Year 6">Year 6</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Topic</label>
            <input type="text" id="inputTopic" required placeholder="e.g. Fractions" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Embed Code (HTML / iframe)</label>
          <textarea id="inputEmbed" rows="4" required placeholder='<iframe src="https://..." ...></iframe>' class="w-full border border-slate-300 rounded-lg p-2.5 text-xs font-mono focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>

        <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800">
          💡 <strong>Admin Note:</strong> Click "Copy JSON Data" below, then paste it into your <code>games.json</code> file in your GitHub repository.
        </div>

        <div class="flex gap-2 pt-2">
          <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition">
            📋 Copy JSON Data
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    let allGames = [];

    // 1. Fetch Data From games.json
    async function fetchGames() {
      try {
        const response = await fetch('games.json');
        if (!response.ok) throw new Error("Failed to load games.json");
        allGames = await response.json();
        
        populateTopicsDropdown();
        renderGames();
      } catch (error) {
        console.error(error);
        document.getElementById('gameGrid').innerHTML = `
          <div class="col-span-full text-center py-12 text-slate-500">
            <p class="text-base">⚠️ Unable to load games list.</p>
            <p class="text-xs mt-1">Make sure the <b>games.json</b> file exists in your GitHub repository.</p>
          </div>`;
      }
    }

    // 2. Populate Dynamic Topics Filter
    function populateTopicsDropdown() {
      const topicSelect = document.getElementById('filterTopic');
      const topics = [...new Set(allGames.map(g => g.topic))].sort();

      topicSelect.innerHTML = '<option value="All">All Topics</option>';
      topics.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        topicSelect.appendChild(opt);
      });
    }

    // 3. Render Game Cards Based on Selected Filters
    function renderGames() {
      const selectedTahun = document.getElementById('filterTahun').value;
      const selectedTopic = document.getElementById('filterTopic').value;
      const grid = document.getElementById('gameGrid');

      const filtered = allGames.filter(game => {
        const matchTahun = (selectedTahun === 'All') || (game.tahun === selectedTahun);
        const matchTopic = (selectedTopic === 'All') || (game.topic === selectedTopic);
        return matchTahun && matchTopic;
      });

      document.getElementById('gameCount').textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 bg-white rounded-xl border border-dashed border-slate-300">
            <p class="text-slate-500 text-sm">No games found matching your selection.</p>
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map(game => `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between overflow-hidden">
          <div class="p-5">
            <div class="flex gap-2 mb-3">
              <span class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded-md border border-indigo-100">${game.tahun}</span>
              <span class="bg-emerald-50 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-md border border-emerald-100">${game.topic}</span>
            </div>
            <h3 class="font-bold text-slate-800 text-lg mb-2 leading-snug">${game.title}</h3>
          </div>
          <div class="px-5 pb-5 pt-0">
            <button onclick="openPlayModal('${game.id}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2">
              ▶️ Play Game
            </button>
          </div>
        </div>
      `).join('');
    }

    // 4. Play Modal Logic
    function openPlayModal(gameId) {
      const game = allGames.find(g => g.id === gameId);
      if (!game) return;

      document.getElementById('playModalTitle').textContent = `${game.title} (${game.tahun} - ${game.topic})`;
      document.getElementById('playModalContainer').innerHTML = game.embedCode;
      document.getElementById('playModal').classList.remove('hidden');
    }

    function closePlayModal() {
      document.getElementById('playModal').classList.add('hidden');
      document.getElementById('playModalContainer').innerHTML = ''; // Clear iframe to stop audio/game playback when closed
    }

    // 5. Admin Modal Logic
    function toggleAdminModal(show) {
      const modal = document.getElementById('adminModal');
      if (show) modal.classList.remove('hidden');
      else modal.classList.add('hidden');
    }

    function handleFormSubmit(event) {
      event.preventDefault();

      const newGame = {
        id: Date.now().toString(),
        title: document.getElementById('inputTitle').value.trim(),
        tahun: document.getElementById('inputTahun').value,
        topic: document.getElementById('inputTopic').value.trim(),
        embedCode: document.getElementById('inputEmbed').value.trim()
      };

      const updatedGamesList = [...allGames, newGame];
      const jsonString = JSON.stringify(updatedGamesList, null, 2);

      // Copy JSON to Clipboard
      navigator.clipboard.writeText(jsonString).then(() => {
        alert("✅ Updated JSON code copied to clipboard!\n\nOpen your 'games.json' file in GitHub and paste this code to update your games list.");
        toggleAdminModal(false);
        document.getElementById('addGameForm').reset();
      }).catch(err => {
        alert("Failed to auto-copy. Check browser console.");
        console.log("Your New JSON Data:\n", jsonString);
      });
    }

    // Initialize application on load
    fetchGames();
  </script>
</body>
</html>
