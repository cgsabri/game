<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Games Hub</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header (Stays Visible Always) -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-4 md:py-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">🎮 Interactive Math Games Hub</h1>
        <p class="text-indigo-200 text-sm">100% Free & Unlimited Google Apps Script Backend</p>
      </div>
      <button onclick="toggleAdminModal(true)" class="bg-indigo-800 hover:bg-indigo-900 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
        🔒 Admin Panel (Add Game)
      </button>
    </div>
  </header>

  <!-- ==================== VIEW 1: HOME PAGE (CATALOG) ==================== -->
  <main id="catalogView" class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">

    <!-- Filters Section -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
      <div class="flex flex-col md:flex-row gap-4 w-full md:w-auto flex-1">
        
        <!-- Filter Year -->
        <div class="w-full md:w-48">
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Year Level</label>
          <select id="filterTahun" onchange="renderGames()" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="All">All Years</option>
            <option value="Year 1">Year 1</option>
            <option value="Year 2">Year 2</option>
            <option value="Year 3">Year 3</option>
            <option value="Year 4">Year 4</option>
            <option value="Year 5">Year 5</option>
            <option value="Year 6">Year 6</option>
          </select>
        </div>

        <!-- Filter Topic -->
        <div class="w-full md:w-48">
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Topic</label>
          <select id="filterTopic" onchange="renderGames()" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="All">All Topics</option>
            <!-- Dynamic topics populated via JS -->
          </select>
        </div>

      </div>

      <!-- Game Counter -->
      <div class="text-sm text-slate-500 self-end md:self-center font-medium">
        Total Games: <span id="gameCount" class="text-indigo-600 font-bold">0</span>
      </div>
    </div>

    <!-- Game Grid Container -->
    <div id="gameGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Dynamic Game Cards load here -->
    </div>

  </main>

  <!-- ==================== VIEW 2: FULL PAGE GAME PLAYER ==================== -->
  <main id="gamePlayerView" class="hidden max-w-6xl mx-auto px-4 py-6 flex-1 w-full flex flex-col">
    <!-- Navigation Bar -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <div>
        <span id="playerBadge" class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded-md border border-indigo-100">Year - Topic</span>
        <h2 id="playerTitle" class="text-xl font-bold text-slate-800 mt-1">Game Title</h2>
      </div>
      <button onclick="closeGamePlayer()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-4 py-2 rounded-lg transition flex items-center gap-2 self-start sm:self-auto">
        ⬅️ Back to All Games
      </button>
    </div>

    <!-- Full Width/Height Game Container -->
    <div id="fullPlayerContainer" class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-md flex-1 min-h-[600px] h-[75vh] w-full flex items-center justify-center">
      <!-- Embedded iframe loads here -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-500">
    <p>© Math Games Hub. Hosted on GitHub Pages & Powered by Google Apps Script.</p>
  </footer>

  <!-- ==================== MODAL: ADMIN (ADD GAME) ==================== -->
  <div id="adminModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h3 class="font-bold text-slate-800 text-lg">⚙️ Add New Game</h3>
        <button onclick="toggleAdminModal(false)" class="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
      </div>

      <form id="addGameForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Game Title</label>
          <input type="text" id="inputTitle" required placeholder="e.g. Basic Fractions Challenge" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Year Level</label>
            <select id="inputTahun" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="Year 1">Year 1</option>
              <option value="Year 2">Year 2</option>
              <option value="Year 3">Year 3</option>
              <option value="Year 4">Year 4</option>
              <option value="Year 5">Year 5</option>
              <option value="Year 6">Year 6</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Topic</label>
            <input type="text" id="inputTopic" required placeholder="e.g. Fractions" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Embed Code (HTML / iframe)</label>
          <textarea id="inputEmbed" rows="4" required placeholder='<iframe src="https://..." ...></iframe>' class="w-full border border-slate-300 rounded-lg p-2.5 text-xs font-mono focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="submit" id="submitBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition">
            📊 Save Directly to Google Sheet
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // -------------------------------------------------------------
    // CONFIGURATION
    // -------------------------------------------------------------
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzEBnOuEN1JtO_Og2yhCZZ8V0jXK3XoFFimzSfRK8faOwHa4ehBEKsxo95K8wNX5gFi/exec";
    const ADMIN_PASSWORD = "admin123"; // 👈 Set your secret admin password here

    let allGames = [];
    let isAuthenticated = false;

    // 1. Fetch Games from Google Apps Script
    async function fetchGames() {
      const grid = document.getElementById('gameGrid');
      grid.innerHTML = `
        <div class="col-span-full text-center py-12 text-slate-400">
          <p class="text-base animate-pulse">⏳ Loading games from Google Sheet...</p>
        </div>`;

      try {
        const response = await fetch(GAS_WEB_APP_URL);
        if (!response.ok) throw new Error("Failed to reach Google Apps Script API.");
        
        const data = await response.json();
        allGames = Array.isArray(data) ? data : [];
        
        populateTopicsDropdown();
        renderGames();
      } catch (error) {
        console.error("Fetch Error:", error.message);
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 text-slate-500">
            <p class="text-base">⚠️ Unable to load games from Google Sheets.</p>
            <p class="text-xs mt-1 text-red-500">${error.message}</p>
          </div>`;
      }
    }

    // 2. Populate Dynamic Topics Filter
    function populateTopicsDropdown() {
      const topicSelect = document.getElementById('filterTopic');
      const topics = [...new Set(allGames.map(g => g.topic).filter(Boolean))].sort();

      topicSelect.innerHTML = '<option value="All">All Topics</option>';
      topics.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        topicSelect.appendChild(opt);
      });
    }

    // 3. Render Game Cards
    function renderGames() {
      const selectedTahun = document.getElementById('filterTahun').value;
      const selectedTopic = document.getElementById('filterTopic').value;
      const grid = document.getElementById('gameGrid');

      const filtered = allGames.filter(game => {
        const matchTahun = (selectedTahun === 'All') || (game.tahun === selectedTahun);
        const matchTopic = (selectedTopic === 'All') || (game.topic === selectedTopic);
        return matchTahun && matchTopic;
      });

      document.getElementById('gameCount').textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 bg-white rounded-xl border border-dashed border-slate-300">
            <p class="text-slate-500 text-sm">No games found matching this selection.</p>
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map(game => `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between overflow-hidden">
          <div class="p-5">
            <div class="flex gap-2 mb-3">
              <span class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded-md border border-indigo-100">${game.tahun || 'N/A'}</span>
              <span class="bg-emerald-50 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-md border border-emerald-100">${game.topic || 'N/A'}</span>
            </div>
            <h3 class="font-bold text-slate-800 text-lg mb-2 leading-snug">${game.title || 'Untitled Game'}</h3>
          </div>
          <div class="px-5 pb-5 pt-0">
            <button onclick="openGamePlayer('${game.id}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2">
              ▶️ Play Game
            </button>
          </div>
        </div>
      `).join('');
    }

    // 4. Full Page Game Player Logic (Replaces Modal)
    function openGamePlayer(gameId) {
      const game = allGames.find(g => String(g.id) === String(gameId));
      if (!game) return;

      // Update Title and Badge
      document.getElementById('playerTitle').textContent = game.title;
      document.getElementById('playerBadge').textContent = `${game.tahun} • ${game.topic}`;

      // Sanitization & Decoding
      let cleanEmbed = game.embedCode || '';
      cleanEmbed = cleanEmbed.replace(/\\"/g, '"');
      const parser = new DOMParser();
      const decoded = parser.parseFromString(cleanEmbed, 'text/html').body.textContent;
      if (decoded && decoded.includes('<iframe')) {
        cleanEmbed = decoded;
      }

      // Inject Embed Code
      const container = document.getElementById('fullPlayerContainer');
      container.innerHTML = cleanEmbed;

      // Force iframe to fit 100% of container space
      const iframe = container.querySelector('iframe');
      if (iframe) {
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
      }

      // Switch Views
      document.getElementById('catalogView').classList.add('hidden');
      document.getElementById('gamePlayerView').classList.remove('hidden');

      // Scroll smoothly to top
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeGamePlayer() {
      // Clear iframe to stop audio/game playback
      document.getElementById('fullPlayerContainer').innerHTML = '';

      // Switch Views Back to Grid
      document.getElementById('gamePlayerView').classList.add('hidden');
      document.getElementById('catalogView').classList.remove('hidden');
    }

    // 5. Admin Modal Logic
    function toggleAdminModal(show) {
      const modal = document.getElementById('adminModal');

      if (show) {
        if (!isAuthenticated) {
          const passwordInput = prompt("🔒 Admin Access Required\nPlease enter the teacher password:");
          if (passwordInput === ADMIN_PASSWORD) {
            isAuthenticated = true;
            modal.classList.remove('hidden');
          } else if (passwordInput !== null) {
            alert("❌ Incorrect password!");
          }
        } else {
          modal.classList.remove('hidden');
        }
      } else {
        modal.classList.add('hidden');
      }
    }

    async function handleFormSubmit(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = "Saving to Google Sheet...";

      const newGame = {
        title: document.getElementById('inputTitle').value.trim(),
        tahun: document.getElementById('inputTahun').value,
        topic: document.getElementById('inputTopic').value.trim(),
        embedCode: document.getElementById('inputEmbed').value.trim()
      };

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(newGame)
        });

        if (!response.ok) throw new Error("Failed to send request.");

        alert("🎉 Game saved successfully to your Google Sheet!");
        toggleAdminModal(false);
        document.getElementById('addGameForm').reset();
        
        setTimeout(fetchGames, 1000);
      } catch (error) {
        alert("Error saving game: " + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "📊 Save Directly to Google Sheet";
      }
    }

    // Initialize application on load
    fetchGames();
  </script>
</body>
</html>
