<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Island Expedition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: full-screen game. Navy HUD bar on top, scrollable isometric island map below,
   floating mission card (left) + minimap (right), modal cards for questions. Single bright look. */
:root{
  --sea:#57c3e6; --navy:#1e3a6b; --navy-2:#2c5296; --navy-3:#3d68b3;
  --ink:#1c2a44; --muted:#5b6b86; --paper:#ffffff; --paper-2:#f2f6fc; --line:#d5e0ef;
  --accent:#ff8a3d; --accent-2:#ffb27a; --gold:#ffbf2e; --good:#1f9d5c; --good-bg:#e3f6ea;
  --bad:#d63d3d; --bad-bg:#fde9e9; --lock:#9aa6b8;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,.station:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--navy-2),var(--navy));color:#fff;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-shadow:0 3px 0 rgba(0,0,0,.15);position:relative;z-index:5;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;background:var(--gold);color:var(--navy);border-radius:12px;padding:4px 10px 2px;
  font-family:var(--display);font-weight:800;line-height:1;font-size:15px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.logo small{display:block;font-size:10px;letter-spacing:.08em;font-weight:700}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who .av{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.who span{font-size:12px;opacity:.85;display:flex;align-items:center;gap:5px}
.who span::before{content:"";width:8px;height:8px;border-radius:50%;background:#4ade80}
.task{flex:1;min-width:180px}
.task .lbl{font-size:12px;opacity:.8;letter-spacing:.04em}
.task .txt{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:9px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:9px;transition:width .6s}
.count{font-family:var(--display);font-weight:800;font-size:15px;opacity:.9}
.pills{display:flex;gap:6px}
.pill{background:rgba(255,255,255,.14);border-radius:20px;padding:4px 11px;font-weight:900;display:flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums}
.pill.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.3);background:var(--gold);color:var(--navy)}}
.tools{display:flex;gap:6px}
.tool{background:var(--paper);color:var(--navy);border:0;border-radius:10px;padding:4px 8px 3px;min-width:52px;display:flex;flex-direction:column;align-items:center;
  font-size:11px;font-weight:800;box-shadow:inset 0 -3px 0 #c8d5ea;line-height:1.15}
.tool .ic{font-size:17px}
.tool:active{transform:translateY(1px)}
@media (max-width:860px){
  .task{order:5;flex-basis:100%}
  .tool{min-width:40px;padding:5px 6px}.tool .t{display:none}
  .logo small{display:none}
}
@media (max-width:520px){.count,.logo,.who span{display:none}.who b{max-width:80px}.hud{gap:8px}.pill{padding:3px 8px;font-size:14px}.tools{gap:4px}.tool{min-width:34px;padding:4px}.tool .ic{font-size:15px}.minimap{display:none}.mission-card{width:auto;right:12px}}

/* ---------- Stage & map ---------- */
.stage{flex:1;position:relative;overflow:hidden;min-height:0}
.map-wrap{position:absolute;inset:0;overflow:auto;background:var(--sea);touch-action:pan-x pan-y;scrollbar-width:thin}
.map-svg{display:block;width:100%;height:100%;min-width:1000px;min-height:560px}
.station{cursor:pointer}
.station .bld{transition:transform .2s}
.station:hover .bld{transform:translateY(-4px)}
.station.locked{cursor:not-allowed}
.station.locked .bld{filter:grayscale(.85) brightness(1.05);opacity:.75}
.bounce{animation:bounce 1s ease-in-out infinite;transform-box:fill-box}
@keyframes bounce{50%{transform:translateY(-10px)}}
.walking .pbody{animation:bob .32s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

/* floating panels */
.panel{position:absolute;background:var(--paper);border-radius:16px;box-shadow:0 6px 0 rgba(30,58,107,.18),0 10px 30px rgba(0,0,0,.12);z-index:3}
.mission-card{top:12px;left:max(12px,env(safe-area-inset-left,0px));width:290px;max-width:calc(100% - 24px);overflow:hidden}
.mc-head{background:var(--navy);color:#fff;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;border:0;width:100%;text-align:left}
.mc-num{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.mc-head b{display:block;font-family:var(--display);font-size:16px;line-height:1.1}
.mc-head small{font-size:12px;opacity:.85}
.mc-head .chev{margin-left:auto;transition:transform .2s;font-size:14px}
.mission-card.closed .chev{transform:rotate(-90deg)}
.mission-card.closed .mc-body{display:none}
.mc-body{padding:10px 12px 12px;display:grid;gap:10px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps li{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:700;color:var(--muted)}
.steps li i{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:12px;border:2px solid var(--line);background:#fff}
.steps li.done{color:var(--ink)}
.steps li.done i{background:var(--good);border-color:var(--good);color:#fff}
.steps li.now{color:var(--navy);background:#fff6d6;border-radius:8px;margin:-3px -5px;padding:3px 5px}
.steps li.now i{border-color:var(--accent);background:var(--accent)}
.doing{font-size:13px;background:var(--paper-2);border-radius:10px;padding:7px 9px;color:var(--navy);font-weight:700}
.row-btns{display:flex;gap:8px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:900;font-size:15px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.btn.primary{background:var(--accent);color:#fff}
.btn.blue{background:var(--navy-3);color:#fff}
.btn.ghost{background:var(--paper-2);color:var(--navy);box-shadow:inset 0 -4px 0 var(--line)}
.btn.good{background:var(--good);color:#fff}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px;flex:1}
.btn[disabled]{opacity:.5;cursor:default}
.minimap{top:12px;right:max(12px,env(safe-area-inset-right,0px));width:190px;padding:8px}
.minimap .mm-t{font-size:12px;font-weight:900;color:var(--navy);display:flex;justify-content:space-between;margin-bottom:4px}
.minimap svg{display:block;width:100%;height:auto;border-radius:10px;background:var(--sea)}
.online{margin-top:6px;font-size:12px;font-weight:800;color:var(--navy);background:var(--paper-2);border-radius:8px;padding:5px 8px;display:flex;gap:6px;align-items:center}
.online::before{content:"";width:8px;height:8px;border-radius:50%;background:#22c55e}
@media (max-width:700px){.minimap{width:120px;padding:6px}.minimap .mm-t span:last-child{display:none}.online{font-size:11px}}
.toast{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy);color:#fff;
  padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;opacity:0;transition:.3s;z-index:4;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:12px;border:0;background:#fff;color:var(--navy);font-size:20px;font-weight:900;box-shadow:inset 0 -4px 0 var(--line),0 4px 10px rgba(0,0,0,.15)}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(18,32,60,.55);backdrop-filter:blur(3px);
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--paper);border-radius:20px;width:min(680px,100%);max-height:calc(100% - 8px);overflow:auto;box-shadow:0 8px 0 rgba(30,58,107,.35),0 20px 50px rgba(0,0,0,.3);animation:rise .3s}
@keyframes rise{from{transform:translateY(20px) scale(.97)}}
.card-top{background:var(--navy);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;gap:10px;align-items:center;position:sticky;top:0;z-index:1}
.card-top b{font-family:var(--display);font-size:18px;line-height:1.1}
.card-top span{font-size:13px;font-weight:800;opacity:.9;white-space:nowrap}
.card-in{padding:16px 18px 18px;display:grid;gap:14px}
.dots{display:flex;gap:5px}
.dots i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.dots i.on{background:var(--good)}.dots i.cur{background:var(--accent)}
.q-text{font-family:var(--display);font-size:22px;line-height:1.25;margin:0;text-wrap:balance;font-weight:700}
.q-visual{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;background:var(--paper-2);border-radius:16px;padding:12px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 14px;text-align:left;font-size:18px;font-weight:800;color:var(--ink);min-height:58px;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--navy-3);background:#f6f9ff}
.opt .L{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none;font-family:var(--display);font-size:17px}
.opt.right{border-color:var(--good);background:var(--good-bg)}.opt.right .L{background:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .4s}.opt.wrong .L{background:var(--bad)}
.opt[disabled]{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.feedback{border-radius:14px;padding:12px 14px;font-size:16px;font-weight:700;line-height:1.4}
.feedback.good{background:var(--good-bg);color:#145c38}
.feedback.bad{background:var(--bad-bg);color:#8f2424}
.feedback b{font-family:var(--display);font-size:18px;margin-right:4px}
.working{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;background:#fff;border-radius:10px;padding:8px 14px;margin-top:8px;display:inline-block;white-space:pre;line-height:1.35;color:var(--ink)}
.foot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.foot .btn{min-width:130px}
.clock-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;color:var(--navy);font-size:14px;text-align:center;max-width:150px}
.tag{background:#fff;border:2px dashed var(--accent);color:var(--ink);border-radius:12px;padding:8px 12px;font-weight:900;font-size:18px;display:flex;align-items:center;gap:6px}
.plus{font-size:24px;font-weight:900;color:var(--navy);align-self:center}
.digits{display:flex;gap:8px}
.digits span{width:64px;height:78px;border-radius:14px;background:#fff;border:3px solid var(--navy-3);display:grid;place-items:center;font-family:var(--display);font-size:46px;font-weight:800;color:var(--navy)}
.shade-area{display:flex;flex-direction:column;align-items:center;gap:10px}
.shade-svg path,.shade-svg rect{cursor:pointer;transition:fill .15s}
.shade-count{font-weight:800;color:var(--navy)}
.fruit-pic{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;font-size:28px;background:#fff;border-radius:12px;padding:8px;max-width:360px}
.fruit-pic span{display:grid;place-items:center}
.fruit-t{border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-weight:800;min-width:260px}
.fruit-t th{background:var(--navy);color:#fff;padding:6px 12px;font-size:14px}
.fruit-t td{border-top:1px solid var(--line);padding:4px 12px;text-align:center;height:40px}
.fruit-t td:first-child{text-align:left}
.fruit-t .q{color:var(--lock)}
.fruit-t .new{background:#fff6d6}
.tw{overflow-x:auto;max-width:100%}
/* nets */
.nets{display:grid;gap:12px}
.zones{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.zone{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:170px}
.zone .nm{font-size:12px;font-weight:900;color:var(--navy);text-align:center}
.slot{width:100%;flex:1;min-height:78px;border:2px dashed var(--lock);border-radius:10px;display:grid;place-items:center;font-size:12px;color:var(--lock);font-weight:800}
.zone.hot .slot{border-color:var(--accent);background:#fff3e8}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:90px;background:var(--paper-2);border-radius:14px;padding:8px;border:2px dashed transparent}
.tray.hot{border-color:var(--accent)}
.net{width:84px;background:#fff;border:3px solid var(--navy-3);border-radius:12px;padding:3px;touch-action:none;user-select:none;cursor:grab;display:flex;flex-direction:column;align-items:center}
.net b{font-family:var(--display);font-size:14px;color:var(--navy);line-height:1}
.net.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-2)}
.net.ok{border-color:var(--good)}
.net.bad{border-color:var(--bad);animation:shake .4s}
.slot .net{width:100%;border-width:2px}
.drag-ghost{position:fixed;pointer-events:none;z-index:50;opacity:.9;transform:translate(-50%,-50%) rotate(-4deg)}
@media (max-width:560px){.zones{grid-template-columns:repeat(3,1fr)}.q-text{font-size:19px}.opt{font-size:16px}.digits span{width:54px;height:66px;font-size:38px}}
/* intro & misc */
.intro{display:flex;gap:14px;align-items:flex-end}
.intro .npc{flex:none}
.bubble{background:var(--paper-2);border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:17px;font-weight:700;line-height:1.4;position:relative}
.bubble .nm{font-family:var(--display);color:var(--accent);font-weight:800;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--paper-2);color:var(--navy);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:800}
.note{font-size:14px;color:var(--muted);font-weight:700;margin:0}
.stars{font-size:46px;letter-spacing:6px;text-align:center;line-height:1}
.stars i{font-style:normal;display:inline-block;animation:starIn .5s both}
.stars i.off{filter:grayscale(1);opacity:.3}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.big-c{text-align:center;display:grid;gap:6px}
.big-c h2{font-family:var(--display);font-size:28px;margin:0;color:var(--navy)}
.list{display:grid;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--paper-2);font-weight:800;border:0;text-align:left;font-size:15px;color:var(--ink);width:100%}
.li .n{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.li.locked{opacity:.55}.li .s{margin-left:auto;white-space:nowrap}
.field{display:grid;gap:4px;font-weight:800;font-size:14px;color:var(--navy)}
.field input,.field textarea{font:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.key{font-size:14px;line-height:1.45}
.key h4{margin:10px 0 4px;color:var(--navy);font-family:var(--display);font-size:16px}
.key ol{margin:0;padding-left:20px}
/* start screen */
.start .card{width:min(520px,100%)}
.hero{background:linear-gradient(180deg,#8fdcf2,#57c3e6);padding:18px;text-align:center;position:relative}
.hero h1{font-family:var(--display);font-size:clamp(30px,7vw,42px);line-height:.95;margin:6px 0 2px;color:var(--navy);text-shadow:0 3px 0 #fff}
.hero p{margin:0;font-weight:800;color:var(--navy)}
.cert{border:6px double var(--gold);border-radius:18px;padding:18px;text-align:center;background:linear-gradient(180deg,#fffdf4,#fff);display:grid;gap:6px}
.cert .t1{font-family:var(--display);font-size:14px;letter-spacing:.2em;color:var(--accent);font-weight:800}
.cert .t2{font-family:var(--display);font-size:30px;color:var(--navy);font-weight:800;line-height:1.1}
.cert .nm{font-family:var(--display);font-size:32px;font-weight:800;border-bottom:2px solid var(--line);padding-bottom:2px;margin:4px auto 0;min-width:60%}
.cert .stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.cert .stats div{background:var(--paper-2);border-radius:12px;padding:6px 12px;font-weight:900}
.coin-fly{position:fixed;z-index:60;font-size:26px;pointer-events:none;animation:fly .9s forwards}
@keyframes fly{to{transform:translateY(-80px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="hud">
    <div class="logo"><span aria-hidden="true">🏝️</span><div>MATH ISLAND<small>EXPEDITION · YEAR 2</small></div></div>
    <div class="who"><div class="av" id="hudAv"></div><div><b id="hudName">Explorer</b><span id="hudCls">Online · 1 player</span></div></div>
    <div class="task"><div class="lbl">CURRENT TASK</div><div class="txt" id="hudTask">Go to the Clock Tower</div><div class="bar"><i id="hudBar" style="width:0%"></i></div></div>
    <div class="count" id="hudCount">0/10</div>
    <div class="pills"><div class="pill" id="pStars">⭐ <span>0</span></div><div class="pill" id="pCoins">🪙 <span>0</span></div></div>
    <nav class="tools">
      <button class="tool" data-tool="guide"><span class="ic">📘</span><span class="t">Guide</span></button>
      <button class="tool" data-tool="ach"><span class="ic">🏆</span><span class="t">Awards</span></button>
      <button class="tool" data-tool="players"><span class="ic">👥</span><span class="t">Players</span></button>
      <button class="tool" data-tool="audio"><span class="ic" id="audIc">🔊</span><span class="t">Audio</span></button>
      <button class="tool" data-tool="settings"><span class="ic">⚙️</span><span class="t">Settings</span></button>
    </nav>
  </header>
  <main class="stage">
    <div class="map-wrap" id="mapWrap">
      <svg class="map-svg" id="map" viewBox="0 20 1200 720" preserveAspectRatio="xMidYMid meet" aria-label="Math Island map">
        <g id="world"></g>
        <g id="playerLayer"></g>
      </svg>
    </div>
    <section class="panel mission-card" id="mCard"></section>
    <aside class="panel minimap">
      <div class="mm-t"><span>🗺️ Island map</span><span id="mmPct">0%</span></div>
      <svg viewBox="0 20 1200 720"><use href="#world"/><circle id="mmDot" r="26" fill="#d63d3d" stroke="#fff" stroke-width="10"/></svg>
      <div class="online">Online: 1 player</div>
    </aside>
    <div class="zoom"><button id="centerBtn" aria-label="Find my explorer">📍</button></div>
    <div class="toast" id="toast" role="status"></div>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="card" id="mBox" role="dialog" aria-modal="true"></div></div>

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s).replace(/<[^>]+>/g,'');
const rad=d=>d*Math.PI/180;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seeded(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  for(let i=0;i<60;i++){const a=rad(i*6),r1=i%5?49:45;s+=`<line x1="${60+r1*Math.sin(a)}" y1="${60-r1*Math.cos(a)}" x2="${60+52*Math.sin(a)}" y2="${60-52*Math.cos(a)}" stroke="#2c5296" stroke-width="${i%5?1:2.6}"/>`}
  for(let n=1;n<=12;n++){const a=rad(n*30);s+=`<text x="${60+36*Math.sin(a)}" y="${60-36*Math.cos(a)+5}" text-anchor="middle" font-size="14" font-weight="800" font-family="Nunito,sans-serif" fill="#1c2a44">${n}</text>`}
  const ha=rad(((h%12)+m/60)*30),ma=rad(m*6);
  s+=`<line x1="60" y1="60" x2="${60+24*Math.sin(ha)}" y2="${60-24*Math.cos(ha)}" stroke="#1c2a44" stroke-width="6" stroke-linecap="round"/>`;
  s+=`<line x1="60" y1="60" x2="${60+41*Math.sin(ma)}" y2="${60-41*Math.cos(ma)}" stroke="#ff8a3d" stroke-width="3.5" stroke-linecap="round"/>`;

}

  s+=`<circle cx="${cx}" cy="${cy}" r="${r+4}" fill="#fff" stroke="#1e3a6b" stroke-width="4"/>`;

function tallySVG(n){

  return s+'</svg>';
}

  const svg=$('#map'),wrap=$('#mapWrap'),ctm=svg.getScreenCTM();if(!ctm)return;
  const r=wrap.getBoundingClientRect(),sx=ctm.a*ppos[0]+ctm.e-r.left,sy=ctm.d*ppos[1]+ctm.f-r.top;

function walkTo(target,cb){
  if(walking)return;
  if(state.pos===target){cb&&cb();return}
  const seq=[];const dir=target>state.pos?1:-1;for(let i=state.pos+dir;dir>0?i<=target:i>=target;i+=dir)seq.push(i);

  const speed=reduce?100000:340;

    if(t0===null)t0=ts;const f=Math.min(1,(ts-t0)/1000*speed/dist);

    if(ts-lastStep>260){sfx.step();lastStep=ts}
    if(f>=1){state.pos=seq[k];k++;from=to.slice();t0=null;if(k>=seq.length){walking=false;$('#player').classList.remove('walking');save();renderPanel();cb&&cb();return}}

  }

}

function visual(v){

  if(v.number)return `<div class="digits" aria-label="${v.number}">${String(v.number).split('').map(d=>`<span>${d}</span>`).join('')}</div>`;
  if(v.money)return v.money.map((a,i)=>`${i?'<span class="plus">+</span>':''}<span class="tag">💵 RM ${a.toFixed(2)}</span>`).join('');
  if(v.fruits)return `<div class="fruit-pic" aria-label="Picture of fruits">${FRUIT_PIC.map(f=>`<span>${f}</span>`).join('')}</div><div class="tw"><table class="fruit-t" id="fruitT">${fruitRows()}</table></div>`;
  if(v.day)return DAY.map(([a,h,mm])=>`<div class="clock-wrap">${clockSVG(h,mm,110)}<span>${a}</span></div>`).join('');
  if(v.story)return `<div style="display:grid;gap:8px;justify-items:center"><div class="chips"><span class="chip">📚 Books</span><span class="chip">✏️ Pencils</span><span class="chip">🏪 Ali's shop</span></div><div class="digits" style="gap:4px"><span style="width:auto;padding:0 14px;font-size:26px;height:56px">RM 120 + RM 75 = RM 195</span></div></div>`;
  return '';
}

function mcq(q){

  $('#qBody').innerHTML=`<div class="opts">${order.map((i,k)=>`<button class="opt" data-i="${i}"><span class="L">${'ABC'[k]}</span><span>${q.opts[i]}</span></button>`).join('')}</div>${q.story?'':''}`;
  $('#qBody').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(+b.dataset.i===0){b.classList.add('right');$('#qBody').querySelectorAll('.opt').forEach(x=>x.disabled=true);
      answerRight(q,b,q.story?`<label class="field" for="ownStory" style="margin-top:10px">Now write your own story (not marked):<textarea id="ownStory" rows="3" placeholder="Ali's shop sold…"></textarea></label>`:'')}
    else{b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');b.disabled=true;answerWrong(q)}
  });

function shade(q){
  let svg='',n=q.parts;
  const c='fill="#fff" stroke="#1e3a6b" stroke-width="3"';
  if(q.shape==='circle'){svg=`<svg class="shade-svg" viewBox="0 0 200 200" width="210" height="210">`;for(let i=0;i<n;i++){const a1=rad(i*360/n),a2=rad((i+1)*360/n);svg+=`<path data-p="${i}" d="M100 100 L${100+90*Math.sin(a1)} ${100-90*Math.cos(a1)} A90 90 0 0 1 ${100+90*Math.sin(a2)} ${100-90*Math.cos(a2)} Z" ${c}/>`}}
  if(q.shape==='rect'){svg=`<svg class="shade-svg" viewBox="0 0 250 100" width="280" height="112">`;for(let i=0;i<n;i++)svg+=`<rect data-p="${i}" x="${5+i*40}" y="5" width="40" height="90" ${c}/>`}
  if(q.shape==='square'){svg=`<svg class="shade-svg" viewBox="0 0 170 170" width="190" height="190">`;for(let i=0;i<4;i++)svg+=`<rect data-p="${i}" x="${5+(i%2)*80}" y="${5+Math.floor(i/2)*80}" width="80" height="80" ${c}/>`}
  svg+='</svg>';
  $('#qBody').innerHTML=`<div class="shade-area">${svg}<div class="shade-count" id="sc">Shaded: 0 of ${n} parts · tap a part to shade it</div><button class="btn blue" id="chk">✔ Check</button></div>`;
  const on=new Set();let locked=false;
  $('#qBody').querySelectorAll('[data-p]').forEach(p=>p.onclick=()=>{if(locked)return;const i=p.dataset.p;on.has(i)?on.delete(i):on.add(i);p.setAttribute('fill',on.has(i)?'#ff8a3d':'#fff');sfx.tap();$('#sc').textContent=`Shaded: ${on.size} of ${n} parts`});
  $('#chk').onclick=()=>{if(locked)return;if(on.size===q.need){locked=true;$('#chk').disabled=true;answerRight(q,$('#chk'))}else answerWrong(q,`You shaded ${on.size} part${on.size===1?'':'s'}. You need to shade exactly ${q.need} of the ${n} parts.`)};
}
function nets(q){
  const labels='PQRST',order=shuffle(NET_KINDS.map(k=>k[0]));
  $('#qBody').innerHTML=`<div class="nets"><div class="zones">${NET_KINDS.map(([k,nm],i)=>`<div class="zone" data-k="${k}"><span class="nm">${i+1}. ${nm}</span>${solidSVG(k)}<div class="slot">drop net here</div></div>`).join('')}</div>
   <div class="tray" id="tray">${order.map((k,i)=>`<div class="net" data-k="${k}" tabindex="0" role="button" aria-label="Net ${labels[i]}"><b>${labels[i]}</b>${netSVG(k)}</div>`).join('')}</div>
   <div style="display:flex;justify-content:center"><button class="btn blue" id="chk">✔ Check my matches</button></div></div>`;
  let sel=null,drag=null,locked=false;const tray=$('#tray');
  const select=n=>{document.querySelectorAll('.net.sel').forEach(x=>x.classList.remove('sel'));sel=n;n&&n.classList.add('sel')};
  function place(net,target){
    if(!target)return;
    if(target.classList.contains('zone')){const slot=target.querySelector('.slot'),old=slot.querySelector('.net');if(old&&old!==net)tray.appendChild(old);slot.textContent='';slot.appendChild(net)}
    else if(target===tray)tray.appendChild(net);
    document.querySelectorAll('.slot').forEach(s=>{if(!s.querySelector('.net'))s.textContent='drop net here'});
    net.classList.remove('bad','ok');sfx.tap();select(null);
  }
  $('#qBody').querySelectorAll('.net').forEach(n=>{
    n.addEventListener('pointerdown',e=>{if(locked)return;drag={n,x:e.clientX,y:e.clientY,moved:false,g:null};n.setPointerCapture(e.pointerId)});
    n.addEventListener('pointermove',e=>{if(!drag||drag.n!==n)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){drag.moved=true;drag.g=n.cloneNode(true);drag.g.classList.add("drag-ghost");drag.g.style.width=n.offsetWidth+'px';document.body.appendChild(drag.g);n.style.opacity=.35}
      if(drag.moved){drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';document.querySelectorAll('.zone.hot,.tray.hot').forEach(z=>z.classList.remove('hot'));const t=hitTarget(e);t&&t.classList.add('hot')}});
    const end=e=>{if(!drag||drag.n!==n)return;const d=drag;drag=null;n.style.opacity='';document.querySelectorAll('.hot').forEach(z=>z.classList.remove('hot'));
      if(d.moved){d.g.remove();place(n,hitTarget(e))}else{select(sel===n?null:n)}};
    n.addEventListener('pointerup',end);n.addEventListener('pointercancel',e=>{if(drag&&drag.g)drag.g.remove();drag=null;n.style.opacity=''});
    n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(sel===n?null:n)}});
  });
  function hitTarget(e){const el=document.elementFromPoint(e.clientX,e.clientY);return el&&(el.closest('.zone')||el.closest('.tray'))}
  $('#qBody').querySelectorAll('.zone').forEach(z=>{z.addEventListener('click',e=>{if(sel&&!locked&&!e.target.closest('.net')){place(sel,z)}});z.tabIndex=0;z.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&sel){e.preventDefault();place(sel,z)}})});
  tray.addEventListener('click',e=>{if(sel&&!e.target.closest('.net'))place(sel,tray)});
  $('#chk').onclick=()=>{
    if(locked)return;const zones=[...document.querySelectorAll('.zone')];
    if(zones.some(z=>!z.querySelector('.net'))){toast('Place all 5 nets on the shapes first.');sfx.oops();return}
    let right=0;zones.forEach(z=>{const n=z.querySelector('.net');if(n.dataset.k===z.dataset.k){right++;n.classList.add('ok')}else n.classList.add('bad')});
    if(run.first){run.marks+=right*2;run.netFirst=right}
    if(right===5){locked=true;$('#chk').disabled=true;const wasFirst=run.first;run.first=false;q._tmp=true;
      if(wasFirst){state.coins+=10;bump('#pCoins')}
      const fb=$('#fb');fb.hidden=false;fb.className='feedback good';fb.innerHTML=`<b>All 5 correct!</b> Cube = 6 squares, cuboid = 6 rectangles, cylinder = 2 circles + 1 rectangle, cone = 1 circle + 1 curved part, pyramid = 1 square + 4 triangles.${wasFirst?'':` You scored ${run.netFirst*2}/10 on your first try.`}`;
      renderHUD();sfx.ding();const nb=$('#qNext');nb.hidden=false;
    }else{run.first=false;answerWrong(q,`${right} of 5 are correct. The red ones are wrong; they go back to the tray. Try again!`);
      setTimeout(()=>zones.forEach(z=>{const n=z.querySelector('.net');if(n&&n.classList.contains('bad')){n.classList.remove('bad');tray.appendChild(n);z.querySelector('.slot').textContent='drop net here'}}),1100)}
  };
}
function finishMission(){
  const m=run.m,max=mMax(m),pct=run.marks/max,stars=pct>=.9?3:pct>=.6?2:1,prev=state.done[m.id];

  if(act==='reset'){if(!resetArm){resetArm=true;a.textContent='Tap again to confirm';setTimeout(()=>{resetArm=false;const r=$('#resetBtn');r&&(r.textContent='Reset progress')},3000);return}
    resetArm=false;state=Object.assign(state,{coins:0,done:{},pos:0});ppos=DOCK.slice();save();placePlayer();drawStations();renderHUD();renderPanel();closeModal();toast('Progress reset.')}
  if(act==='again'){if(!againArm){againArm=true;a.textContent='Tap again to restart';setTimeout(()=>{againArm=false},3000);return}
    againArm=false;state=Object.assign(state,{coins:0,done:{},pos:0});ppos=DOCK.slice();save();placePlayer();drawStations();renderHUD();renderPanel();closeModal();follow();toast('New expedition started! Good luck!')}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!$('#modal').classList.contains('start')&&!run){closeModal();renderPanel()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden&&!$('#modal').classList.contains('start')){if(run){run=null;renderHUD()}closeModal();renderPanel()}});
window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(follow,150)});

/* ================= boot ================= */
drawWorld();drawPlayer();renderHUD();renderPanel();
requestAnimationFrame(follow);
showStart();
</script>
</body>
</html>
